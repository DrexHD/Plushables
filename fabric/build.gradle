plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.khazoda:khazodacore-fabric:${khazodacore_version}"
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

fabricApi.configureDataGeneration {
    modId = mod_id
    outputDirectory = project(':common').file('src/main/generated')
    addToResources = false
    createSourceSet = true
    client = true
}

def generatedDataDir = project(':common').file('src/main/generated/data')
def generatedNamespaces = ['minecraft', mod_id]

tasks.register('syncGeneratedResourcesToCommonBuild', Sync) {
    from(generatedDataDir)
    into(project(':common').layout.buildDirectory.dir('resources/main/data'))
}

tasks.register('syncGeneratedResourcesToCommonIdea', Sync) {
    from(generatedDataDir)
    into(project(':common').layout.projectDirectory.dir('out/main/resources/data'))
}

tasks.register('cleanGeneratedResourcesFromLoaderOutputs') {
    doLast {
        [
                layout.buildDirectory.dir('resources/main/data').get().asFile,
                project(':neoforge').layout.buildDirectory.dir('resources/main/data').get().asFile,
                layout.projectDirectory.dir('out/main/resources/data').asFile,
                project(':neoforge').layout.projectDirectory.dir('out/main/resources/data').asFile
        ].each { dataDir ->
            fileTree(generatedDataDir).visit { details ->
                if (!details.isDirectory()) {
                    delete(new File(dataDir, details.relativePath.pathString))
                }
            }

            generatedNamespaces.each { namespace ->
                def namespaceDir = new File(dataDir, namespace)
                if (!namespaceDir.exists()) {
                    return
                }

                fileTree(namespaceDir)
                        .visit { details ->
                            if (details.isDirectory()) {
                                File dir = details.file
                                if (dir.exists() && dir.listFiles()?.length == 0) {
                                    dir.delete()
                                }
                            }
                        }

                if (namespaceDir.listFiles()?.length == 0) {
                    namespaceDir.delete()
                }
            }
        }
    }
}

tasks.named('runDatagen') {
    finalizedBy('syncGeneratedResourcesToCommonBuild', 'syncGeneratedResourcesToCommonIdea', 'cleanGeneratedResourcesFromLoaderOutputs')
}

def exportRoot = rootProject.layout.projectDirectory.dir('export')

tasks.named('jar') {
    archiveFileName.set("${mod_id}-fabric-${project.version}.jar")
    destinationDirectory.set(exportRoot)
}

tasks.named('sourcesJar') {
    archiveFileName.set("${mod_id}-fabric-${project.version}-sources.jar")
    destinationDirectory.set(exportRoot.dir('source'))
}

tasks.named('javadocJar') {
    archiveFileName.set("${mod_id}-fabric-${project.version}-javadoc.jar")
    destinationDirectory.set(exportRoot.dir('javadoc'))
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
